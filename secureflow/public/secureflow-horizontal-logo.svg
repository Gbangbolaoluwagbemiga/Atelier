<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="h-primary" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="h-accent" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="h-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Logo Icon -->
  <g filter="url(#h-shadow)">
    <!-- Shield -->
    <path d="M60 20L90 35V60C90 80 75 92 60 100C45 92 30 80 30 60V35L60 20Z" 
          fill="url(#h-primary)" stroke="white" stroke-width="1.5"/>
    
    <!-- Inner highlight -->
    <path d="M60 30L80 40V60C80 75 70 85 60 92C50 85 40 75 40 60V40L60 30Z" 
          fill="white" opacity="0.15"/>
  </g>

  <!-- Checkmark -->
  <g stroke="url(#h-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M50 65L58 73L75 55"/>
  </g>

  <!-- Text: SecureFlow -->
  <text x="130" y="75" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#1F2937" letter-spacing="-0.5">
    SecureFlow
  </text>

  <!-- Tagline -->
  <text x="130" y="100" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#6B7280" letter-spacing="0.3">
    Secure Escrow Platform
  </text>
</svg>
