<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Atelier">
  <!--
    Favicon variant: same mark on a dark rounded tile.

    The bare mark disappears against a dark browser tab, and a tab icon has to
    survive being 16px on someone else's background — so this one carries its own
    ground and slightly heavier strokes.
  -->
  <rect width="64" height="64" rx="15" fill="#0B0E13"/>
  <defs>
    <linearGradient id="fav-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#45C8D6"/>
      <stop offset="100%" stop-color="#F2C15C"/>
    </linearGradient>
  </defs>
  <path d="M32 15 L17 48" fill="none" stroke="#45C8D6" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M32 15 L47 48" fill="none" stroke="#F2C15C" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M22.5 38 L41.5 38" fill="none" stroke="url(#fav-bar)" stroke-width="6.5" stroke-linecap="round"/>
</svg>
