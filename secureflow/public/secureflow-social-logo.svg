<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#1A0033"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="300" y1="200" x2="900" y2="1050" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7D00FF"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="480" y1="520" x2="800" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shield-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#7D00FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="1200" height="1200" fill="url(#bg-grad)"/>

  <!-- Subtle radial glow behind shield -->
  <circle cx="600" cy="560" r="420" fill="#7D00FF" opacity="0.08"/>

  <!-- Shield -->
  <g filter="url(#shield-glow)">
    <path d="M600 185L905 340V590C905 800 758 958 600 1055C442 958 295 800 295 590V340L600 185Z"
          fill="url(#shield-grad)" opacity="0.95"/>
    <!-- Inner shield highlight -->
    <path d="M600 285L825 415V590C825 755 718 880 600 962C482 880 375 755 375 590V415L600 285Z"
          fill="white" opacity="0.07"/>
  </g>

  <!-- Flowing lines — secure payment flow -->
  <g stroke="url(#accent-grad)" stroke-width="18" stroke-linecap="round" fill="none" filter="url(#glow)" opacity="0.9">
    <path d="M472 575C444 618 428 682 448 745"/>
    <path d="M600 515C600 598 600 700 600 785"/>
    <path d="M728 575C756 618 772 682 752 745"/>
  </g>

  <!-- Checkmark -->
  <g stroke="#E879F9" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <path d="M468 748L578 858L808 608"/>
  </g>

  <!-- Lock outline — subtle security cue -->
  <g opacity="0.35">
    <rect x="518" y="415" width="164" height="144" rx="22" fill="none" stroke="white" stroke-width="10"/>
    <path d="M558 415V298C558 198 600 138 600 138C600 138 642 198 642 298V415" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
    <circle cx="600" cy="515" r="11" fill="white"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="1108"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="82" font-weight="700" fill="white"
        text-anchor="middle" letter-spacing="-1" opacity="0.92">
    SecureFlow
  </text>
</svg>
