[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
# OpenZeppelin 5.1's ERC1967Utils requires ^0.8.21, so 0.8.20 can no longer
# build the UUPS proxy path.
solc_version = "0.8.28"

# Pinned, not defaulted. solc 0.8.28 defaults to "cancun", which emits MCOPY and
# TSTORE — opcodes Arc EVM is not guaranteed to have. The original 0.8.20 build
# defaulted to "shanghai" and deploys fine on Arc, so that is the target we keep.
# Raise this only after confirming Arc supports the newer opcodes.
evm_version = "shanghai"

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[etherscan]
arc_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://testnet.arcscan.app/api" }
